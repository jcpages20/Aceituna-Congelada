<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#d4f0f7"><title>Aceituna Congelada</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173c35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#ccebf1}button{font:inherit;cursor:pointer}#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(155deg,#a5e2e8,#eef9e8 55%,#aed9a0)}.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}.panel{width:min(92vw,420px);max-height:calc(100dvh - 32px);overflow:auto;margin:auto;padding:19px 21px 23px;text-align:center;border:3px solid #2b695a;border-radius:25px;background:#fffff2ed;box-shadow:0 14px 0 #2a6a5680,0 22px 55px #24564448}h1{font-size:clamp(30px,9vw,45px);line-height:.94;margin:7px 0 12px;color:#236346;letter-spacing:-2px;text-shadow:2px 3px 0 #c1eabd}.eyebrow{font-weight:900;letter-spacing:3px;color:#579078;font-size:11px}.mascot{display:block;width:min(66vw,235px);height:min(31dvh,230px);object-fit:cover;object-position:center 28%;border-radius:22px;margin:0 auto 13px;border:4px solid #e0f4df;filter:drop-shadow(0 5px 8px #5479625e)}.subtitle{font-size:13px;font-weight:700;margin:7px auto 14px}.stats{background:#e5f5db;border-radius:16px;padding:11px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:15px}.stats strong{font-size:22px;display:block}.stats span{font-size:10px;font-weight:800;display:block}.btn{border:0;border-radius:15px;color:white;background:#318657;width:100%;padding:15px 18px;font-size:20px;font-weight:900;box-shadow:0 6px 0 #195337;touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #195337}.secondary{background:#d8e6d5;color:#21503a;box-shadow:0 5px 0 #8eb39a;margin-top:12px;font-size:16px}.hint{font-size:11px;opacity:.75;margin:15px 0 0}.game{flex-direction:column;touch-action:none}#hud{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:7px;padding:calc(env(safe-area-inset-top) + 9px) 13px 10px;background:#f1ffeddf;border-bottom:3px solid #8ec8ad;box-shadow:0 3px 7px #345a3930;font-weight:900;font-size:14px}#hud .value{font-size:19px;color:#256e47}#pauseBtn{font-size:21px;background:#dcf0df;border:2px solid #a8cbaa;border-radius:12px;padding:5px 11px}#canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{z-index:5;position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#113a32a9;padding:18px}.overlay.visible{display:flex}.overlay .panel{width:min(90vw,360px)}.overlay h2{font-size:30px;margin:5px 0 16px}.overScore{font-size:22px;font-weight:900}.new{background:#ffdc73;border-radius:15px;padding:9px;margin-bottom:13px;font-weight:900}.footerMascot{height:130px;width:140px;object-fit:cover;object-position:center 22%;border-radius:17px;margin:0 auto 12px;display:block}@media(max-height:650px){.panel{padding:11px 16px}.mascot{height:120px}h1{font-size:30px}.stats{margin-bottom:9px}}
</style></head><body><div id="app"><section id="menu" class="screen active"><div class="panel"><div class="eyebrow">🫒 EL JUEGO DEL AÑO 🧊</div><h1>ACEITUNA<br>CONGELADA</h1><img class="mascot" src="personaje.webp" alt="Mascota sonriente con aceituna"><p class="subtitle">¡Atrapa aceitunas y esquiva la comida sana!</p><div class="stats"><div><strong id="bestMenu">0</strong><span>RÉCORD</span></div><div><strong id="playedMenu">0</strong><span>PARTIDAS</span></div><div><strong id="totalMenu">0</strong><span>ACEITUNAS</span></div></div><button class="btn" id="playBtn">▶ JUGAR</button><p class="hint">Desliza el dedo para mover el pote 🫙</p></div></section><section id="game" class="screen game"><div id="hud"><div>🫒 <span class="value" id="score">0</span></div><div>❤️ <span class="value" id="lives">3</span></div><div>🏆 <span class="value" id="bestHud">0</span></div><button id="pauseBtn" aria-label="Pausar">Ⅱ</button></div><canvas id="canvas"></canvas></section><div id="pauseOverlay" class="overlay"><div class="panel"><h2>EN PAUSA 🧊</h2><button id="resumeBtn" class="btn">CONTINUAR</button><button id="quitBtn" class="btn secondary">SALIR AL MENÚ</button></div></div><div id="endOverlay" class="overlay"><div class="panel"><h2>¡LA SALUD TE DERROTÓ!</h2><img src="personaje.webp" class="footerMascot" alt="Mascota"><div class="overScore">🫒 Puntos: <span id="finalScore">0</span></div><p>🏆 Récord: <b id="finalBest">0</b></p><p id="newRecord" class="new" hidden>🎉 ¡NUEVO RÉCORD!</p><button id="retryBtn" class="btn">↻ REINTENTAR</button><button id="homeBtn" class="btn secondary">MENÚ PRINCIPAL</button></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),app=$('app'),menu=$('menu'),game=$('game'),canvas=$('canvas'),ctx=canvas.getContext('2d'),mascot=new Image();mascot.src='personaje.webp';const poses=['pose_saludo.webp','pose_baile.webp','pose_salto.webp','pose_tarro.webp'].map(src=>{const im=new Image();im.src=src;return im});let cameoPose=0,cameoMode=0,cameoTime=0,cameoWords='',lastMilestone=0;const KEY='aceituna-congelada-v1';let saved={best:0,played:0,total:0};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){};function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}function stats(){$('bestMenu').textContent=saved.best;$('playedMenu').textContent=saved.played;$('totalMenu').textContent=saved.total;$('bestHud').textContent=Math.max(saved.best,score)}let w=0,h=0,dpr=1,score=0,lives=3,bucketX=0,items=[],particles=[],elapsed=0,spawnTimer=0,mascotTimer=0,mascotOpacity=0,playing=false,paused=false,last=0,raf=0;const objects=[{emoji:'🫒',type:'good',points:1},{emoji:'🥶',type:'good',points:3},{emoji:'🥦',type:'bad'},{emoji:'🥕',type:'bad'},{emoji:'🍎',type:'bad'},{emoji:'🥑',type:'bad'},{emoji:'🥬',type:'bad'}];function resize(){const r=app.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);bucketX=Math.max(47,Math.min(w-47,bucketX||w/2))}addEventListener('resize',resize);resize();function start(){cancelAnimationFrame(raf);$('endOverlay').classList.remove('visible');$('pauseOverlay').classList.remove('visible');menu.classList.remove('active');game.classList.add('active');resize();score=0;lives=3;items=[];particles=[];elapsed=0;spawnTimer=.25;mascotTimer=5;mascotOpacity=0;cameoPose=0;cameoMode=0;cameoTime=0;cameoWords='';lastMilestone=0;bucketX=w/2;playing=true;paused=false;saved.played++;save();$('score').textContent=score;$('lives').textContent=lives;stats();last=performance.now();raf=requestAnimationFrame(loop)}function quit(){playing=false;paused=false;cancelAnimationFrame(raf);$('pauseOverlay').classList.remove('visible');$('endOverlay').classList.remove('visible');game.classList.remove('active');menu.classList.add('active');stats()}function finish(){playing=false;cancelAnimationFrame(raf);const record=score>saved.best;if(record)saved.best=score;save();stats();$('finalScore').textContent=score;$('finalBest').textContent=saved.best;$('newRecord').hidden=!record;$('endOverlay').classList.add('visible')}function spawn(){const good=Math.random()<.71;let pool=good?objects.slice(0,2):objects.slice(2);let ob=pool[good&&Math.random()<.90?0:Math.floor(Math.random()*pool.length)];let r=18+Math.random()*7;items.push({x:r+Math.random()*Math.max(1,w-2*r),y:-r-8,r,vy:135+Math.min(270,score*4)+Math.random()*75,type:ob.type,points:ob.points||0,emoji:ob.emoji,rot:Math.random()*.3-.15})}function burst(x,y,s){for(let i=0;i<9;i++){const a=Math.PI*2*i/9;particles.push({x,y,vx:Math.cos(a)*(45+Math.random()*80),vy:Math.sin(a)*(45+Math.random()*80)-25,life:.45,color:s})}}function round(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}function render(){ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#c9eef5');bg.addColorStop(.65,'#e7f7ef');bg.addColorStop(1,'#b5deb1');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.2;ctx.fillStyle='#fff';for(let i=0;i<18;i++){round(((i*113+elapsed*9)% (w+60))-30,(i*171)%(h+40),2+(i%4));ctx.fill()}ctx.globalAlpha=1;if(mascotOpacity>0){const im=poses[cameoPose].complete&&poses[cameoPose].naturalWidth?poses[cameoPose]:mascot;if(im.complete&&im.naturalWidth){const mw=Math.min(w*.70,cameoMode===3?340:270),mh=mw;let xx=w*.5,yy=h*.43;if(cameoMode===1)xx=w*.28;if(cameoMode===2)xx=w*.74;if(cameoMode===3)yy=h*.38;ctx.save();ctx.globalAlpha=mascotOpacity;ctx.translate(xx,yy);ctx.rotate(cameoMode===1?-.09:cameoMode===2?.08:0);const jump=cameoPose===2?Math.sin(elapsed*10)*12:0;const dance=cameoPose===1?Math.sin(elapsed*9)*.045:0;ctx.rotate(dance);ctx.drawImage(im,-mw/2,-mh/2+jump,mw,mh);ctx.restore();if(cameoWords&&cameoTime>0){ctx.save();ctx.globalAlpha=Math.min(1,cameoTime,mascotOpacity*3);ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#ffffff';ctx.fillStyle='#216542';ctx.strokeText(cameoWords,w/2,h*.16);ctx.fillText(cameoWords,w/2,h*.16);ctx.restore()}}}ctx.font='bold 12px system-ui';ctx.fillStyle='#539579';ctx.textAlign='center';ctx.fillText('DESLIZA PARA MOVER EL POTE',w/2,h-23);for(const it of items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);ctx.font=`${it.r*2.1}px Apple Color Emoji,Segoe UI Emoji,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.emoji,0,0);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.45);ctx.fillStyle=p.color;round(p.x,p.y,4);ctx.fill()}ctx.globalAlpha=1;const jarY=h-110,jarW=90,jarH=90;ctx.save();ctx.translate(bucketX,jarY);ctx.fillStyle='#9bdceb66';ctx.strokeStyle='#4b9db0';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-jarW/2+5,12);ctx.lineTo(-jarW/2+10,jarH);ctx.quadraticCurveTo(0,jarH+9,jarW/2-10,jarH);ctx.lineTo(jarW/2-5,12);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#dffaffb2';ctx.fillRect(-37,25,11,49);ctx.strokeStyle='#2e778b';ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(0,11,jarW/2,10,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#285c4d';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('ACEITUNAS',0,65);ctx.restore()}function loop(now){if(!playing||paused)return;let dt=Math.min((now-last)/1000,.045);last=now;elapsed+=dt;spawnTimer-=dt;const spawnEvery=Math.max(.31, .88-score*.008);if(spawnTimer<=0){spawn();spawnTimer=spawnEvery}mascotTimer-=dt;if(mascotTimer<=0){cameoPose=Math.floor(Math.random()*poses.length);cameoMode=Math.floor(Math.random()*4);cameoWords=['¡HOLA, ACEITUNERO!','¡A BAILAR!','¡OLÉ, OLÉ!','¡EL TARRO MANDA!'][cameoPose];cameoTime=2.5;mascotOpacity=.35;mascotTimer=7+Math.random()*6}if(score>=10&&Math.floor(score/10)>lastMilestone){lastMilestone=Math.floor(score/10);cameoPose=2;cameoMode=3;cameoWords='¡'+score+' ACEITUNAS!';cameoTime=2.8;mascotOpacity=.43}cameoTime=Math.max(0,cameoTime-dt);mascotOpacity=Math.max(0,mascotOpacity-dt*.11);const catchY=h-110;for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.vy*dt;if(it.y+it.r>catchY+7&&it.y-it.r<catchY+35&&Math.abs(it.x-bucketX)<43){items.splice(i,1);burst(it.x,it.y,it.type==='good'?'#70bd63':'#f46a63');if(it.type==='good'){score+=it.points;saved.total++;save();$('score').textContent=score;$('bestHud').textContent=Math.max(saved.best,score)}else{lives--;$('lives').textContent=lives;if(navigator.vibrate)navigator.vibrate(80);if(lives<=0){render();finish();return}}}else if(it.y-it.r>h){items.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}render();raf=requestAnimationFrame(loop)}function pointer(e){if(!playing||paused)return;const r=canvas.getBoundingClientRect();bucketX=Math.max(47,Math.min(w-47,e.clientX-r.left))}canvas.addEventListener('pointerdown',e=>{pointer(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',pointer);$('playBtn').onclick=start;$('retryBtn').onclick=start;$('homeBtn').onclick=quit;$('quitBtn').onclick=quit;$('pauseBtn').onclick=()=>{if(!playing)return;paused=true;cancelAnimationFrame(raf);$('pauseOverlay').classList.add('visible')};$('resumeBtn').onclick=()=>{paused=false;$('pauseOverlay').classList.remove('visible');last=performance.now();raf=requestAnimationFrame(loop)};stats();})();
</script></body></html>
